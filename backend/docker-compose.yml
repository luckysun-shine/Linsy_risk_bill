version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: linsy-bill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bill_secret
      MYSQL_DATABASE: linsy_risk_bill
      MYSQL_USER: bill
      MYSQL_PASSWORD: bill_secret
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    command: ['--default-authentication-plugin=mysql_native_password', '--character-set-server=utf8mb4']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pbill_secret']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linsy-bill-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://bill:bill_secret@mysql:3306/linsy_risk_bill
      JWT_SECRET: change-this-to-a-long-random-secret-in-production
      BASE_URL: http://localhost:5173
    ports:
      - '3000:3000'

volumes:
  mysqldata:
